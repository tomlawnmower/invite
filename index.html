<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Alice & Bob's Wedding | Envelope Opening</title>
    
    <!-- Google Fonts: Playfair Display, Noto Serif TC & Quicksand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #f0f9ff;
            color: #0c4a6e;
            font-family: 'Quicksand', sans-serif;
            overflow-x: hidden;
        }

        /* 250vh scroll container to give plenty of room for scroll-driven envelope opening */
        .intro-scroll-container {
            width: 100%;
            height: 250vh;
            position: relative;
        }

        /* Sticky viewport that remains fixed at top: 0 while scrolling */
        .intro-sticky-viewport {
            position: sticky;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Fixed viewport layers so viewport remains locked while scrolling */
        .intro-underlayer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #f0f9ff 0%, #e0f2fe 100%);
            z-index: 1;
            padding: 20px;
        }

        .preview-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid #bae6fd;
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            max-width: 520px;
            width: 90%;
            box-shadow: 0 15px 35px rgba(2, 132, 199, 0.15);
        }

        .preview-subtitle {
            font-family: 'Playfair Display', serif;
            color: #0284c7;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .preview-title {
            font-family: 'Playfair Display', serif;
            color: #0f172a;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .preview-date {
            background: #e0f2fe;
            color: #0369a1;
            display: inline-block;
            padding: 6px 18px;
            border-radius: 20px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .btn-enter-site {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff !important;
            font-weight: 700;
            padding: 12px 30px;
            border-radius: 25px;
            border: none;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
            text-decoration: none !important;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .btn-enter-site:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(2, 132, 199, 0.4);
        }

        /* Top Overlayer: Fixed Envelope Flaps */
        .envelope-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: auto;
            cursor: pointer;
            overflow: hidden;
        }

        .envelope-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            z-index: 10;
            will-change: transform;
            cursor: pointer;
        }

        .envelope-right {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            z-index: 11;
            filter: drop-shadow(-8px 0 20px rgba(0, 0, 0, 0.25));
            will-change: transform;
            cursor: pointer;
        }

        /* Floating Controls & Hints */
        .skip-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 2px solid #bae6fd;
            border-radius: 20px;
            padding: 6px 16px;
            color: #0369a1;
            font-weight: 700;
            font-size: 0.85rem;
            text-decoration: none !important;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.15);
            transition: all 0.25s ease;
        }

        .skip-btn:hover {
            background: #0284c7;
            color: #ffffff;
        }

        .scroll-hint {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border: 2px solid #bae6fd;
            border-radius: 25px;
            padding: 10px 22px;
            color: #0c4a6e;
            font-size: 0.92rem;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.25);
            cursor: pointer;
            pointer-events: auto;
            transition: opacity 0.3s ease;
            white-space: nowrap;
        }

        .anim-bounce {
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }
    </style>
</head>
<body>

    <!-- Skip Button -->
    <a href="invitation.html" class="skip-btn"><i class="fa-solid fa-paper-plane mr-1"></i> Enter Website</a>

    <!-- Scroll Container -->
    <div class="intro-scroll-container" id="scrollContainer">
        <div class="intro-sticky-viewport">
            
            <!-- Underlayer: Save The Date Preview -->
            <div class="intro-underlayer">
                <div class="preview-card shadow-lg">
                    <p class="preview-subtitle">Save The Date</p>
                    <h1 class="preview-title">Alice &amp; Bob's Wedding</h1>
                    <p class="preview-date"><i class="fa-solid fa-paw mr-2"></i>November 11, 2026</p>
                    <div>
                        <a href="invitation.html" class="btn-enter-site">
                            Enter Invitation Website <i class="fa-solid fa-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Overlayer: Envelope Flaps -->
            <div class="envelope-overlay" id="envelopeOverlay" onclick="openEnvelope()">
                <img src="images/envelope_left.png" alt="Envelope Left" class="envelope-left" id="envelopeLeft">
                <img src="images/envelope_right.png" alt="Envelope Right" class="envelope-layer envelope-right" id="envelopeRight">
                
                <div class="scroll-hint" id="scrollHint">
                    <i class="fa-solid fa-chevron-down mr-1 anim-bounce"></i> Scroll down or click to open
                </div>
            </div>

        </div>
    </div>

    <script>
        // Ensure scroll starts at top
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }
        window.scrollTo(0, 0);

        const scrollContainer = document.getElementById('scrollContainer');
        const envelopeLeft = document.getElementById('envelopeLeft');
        const envelopeRight = document.getElementById('envelopeRight');
        const scrollHint = document.getElementById('scrollHint');
        let autoRedirected = false;
        let isOpening = false;

        function updateEnvelopeScroll() {
            if (!scrollContainer || !envelopeLeft || !envelopeRight) return;
            const totalScroll = Math.max(1, scrollContainer.offsetHeight - window.innerHeight);
            const currentScroll = Math.max(0, window.scrollY);
            const progress = Math.min(1, currentScroll / totalScroll);

            // Slide left flap to left (-105%) and right flap to right (+105%)
            envelopeLeft.style.transform = `translate3d(${-progress * 105}%, 0, 0)`;
            envelopeRight.style.transform = `translate3d(${progress * 105}%, 0, 0)`;

            if (scrollHint) {
                scrollHint.style.opacity = Math.max(0, 1 - progress * 3.5).toString();
            }

            // Automatically navigate to invitation.html when envelope is fully opened
            if (progress >= 0.6 && !autoRedirected) {
                autoRedirected = true;
                setTimeout(() => {
                    window.location.href = 'invitation.html';
                }, 350);
            }
        }

        function openEnvelope() {
            if (isOpening) return;
            isOpening = true;

            const startTime = performance.now();
            const duration = 4000; // slower for smooth slide open animation
            const startScroll = window.scrollY;
            const totalScroll = Math.max(1, scrollContainer.offsetHeight - window.innerHeight);

            function animateStep(timestamp) {
                const elapsed = timestamp - startTime;
                const progress = Math.min(1, elapsed / duration);
                // Smooth easeOutCubic curve
                const ease = 1 - Math.pow(1 - progress, 3);
                
                const currentScroll = startScroll + (totalScroll - startScroll) * ease;
                window.scrollTo(0, currentScroll);

                if (progress < 1) {
                    requestAnimationFrame(animateStep);
                }
            }

            requestAnimationFrame(animateStep);
        }

        window.addEventListener('scroll', updateEnvelopeScroll, { passive: true });
        window.addEventListener('resize', updateEnvelopeScroll);
        window.addEventListener('load', updateEnvelopeScroll);
        updateEnvelopeScroll();
    </script>
</body>
</html>
