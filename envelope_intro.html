<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Pin-Chun & Thomas's Wedding | Envelope Opening</title>
    
    <!-- Google Fonts: Playfair Display, Noto Serif TC & Quicksand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #f0f9ff;
            font-family: 'Quicksand', sans-serif;
            overflow-x: hidden;
        }

        .intro-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* Video Container Wrapper */
        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 580px;
            aspect-ratio: 16 / 9;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 16px 40px rgba(2, 132, 199, 0.18);
            overflow: hidden;
            border: 3px solid #bae6fd;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .video-wrapper:hover {
            transform: scale(1.02);
        }

        video.envelope-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Play Overlay Badge */
        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .play-overlay.hidden {
            opacity: 0;
        }

        .play-icon-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(2, 132, 199, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 8px 24px rgba(2, 132, 199, 0.4);
            margin-bottom: 12px;
            transition: transform 0.3s ease;
        }

        .play-text {
            font-size: 1.1rem;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        /* Underlayer: Card Preview & Enter Button */
        .intro-underlayer {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 30px;
            text-align: center;
            width: 100%;
            max-width: 580px;
            pointer-events: none;
        }

        .intro-underlayer.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .preview-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px 20px;
            border: 2px solid #bae6fd;
            box-shadow: 0 12px 30px rgba(2, 132, 199, 0.15);
        }

        .preview-subtitle {
            color: #0284c7;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .preview-title {
            font-family: 'Playfair Display', serif;
            color: #0f172a;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .preview-date {
            color: #475569;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .btn-enter-site {
            display: inline-block;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 14px 36px;
            border-radius: 50px;
            text-decoration: none !important;
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.35);
            transition: all 0.3s ease;
        }

        .btn-enter-site:hover {
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(2, 132, 199, 0.45);
        }

        .scroll-hint {
            margin-top: 20px;
            color: #64748b;
            font-size: 0.95rem;
            font-weight: 600;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }
    </style>
</head>
<body>

    <div class="intro-container">
        
        <!-- Interactive Envelope Opening Video Container -->
        <div class="video-wrapper" id="videoWrapper">
            <video id="envelopeVideo" class="envelope-video" playsinline muted preload="auto">
                <source src="images/envelope_open.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            
            <div class="play-overlay" id="playOverlay">
                <div class="play-icon-circle">
                    <i class="fa-solid fa-play" style="margin-left: 4px;"></i>
                </div>
                <div class="play-text">Click or Scroll to Open Envelope</div>
            </div>
        </div>

        <!-- Scroll Hint -->
        <div class="scroll-hint" id="scrollHint">
            <i class="fa-solid fa-chevron-down mr-1"></i> Scroll down or click to watch invitation reveal
        </div>

        <!-- Underlayer: Save The Date Preview -->
        <div class="intro-underlayer" id="introUnderlayer">
            <div class="preview-card shadow-lg">
                <p class="preview-subtitle">Save The Date</p>
                <h1 class="preview-title">Pin-Chun &amp; Thomas's Wedding</h1>
                <p class="preview-date"><i class="fa-solid fa-paw mr-2"></i>December 12, 2026</p>
                <div>
                    <a href="index.html" class="btn-enter-site">
                        Enter Invitation Website <i class="fa-solid fa-arrow-right ml-2"></i>
                    </a>
                </div>
            </div>
        </div>

    </div>

    <script>
        const videoWrapper = document.getElementById('videoWrapper');
        const envelopeVideo = document.getElementById('envelopeVideo');
        const playOverlay = document.getElementById('playOverlay');
        const scrollHint = document.getElementById('scrollHint');
        const introUnderlayer = document.getElementById('introUnderlayer');

        let videoPlayed = false;

        function playEnvelopeAnimation() {
            if (videoPlayed) return;
            videoPlayed = true;
            
            playOverlay.classList.add('hidden');
            if (scrollHint) scrollHint.style.display = 'none';

            envelopeVideo.play().then(() => {
                // Play successful
            }).catch(err => {
                console.log("Autoplay blocked, user interaction required:", err);
                revealUnderlayer();
            });
        }

        function revealUnderlayer() {
            introUnderlayer.classList.add('visible');
        }

        // When video ends, reveal the underlayer card & enter button
        envelopeVideo.addEventListener('ended', revealUnderlayer);

        // Click wrapper to trigger play
        videoWrapper.addEventListener('click', playEnvelopeAnimation);

        // Scroll listener to auto-trigger play when scrolling down
        let scrolled = false;
        window.addEventListener('scroll', () => {
            if (!scrolled && window.scrollY > 20) {
                scrolled = true;
                playEnvelopeAnimation();
            }
        });
    </script>
</body>
</html>
